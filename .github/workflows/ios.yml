name: iOS (Expo prebuild) build & test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps (locked)
        run: npm ci || npm install

      - name: Toolchain sanity (Xcode + Node)
        run: |
          xcodebuild -version
          node -v
          npm -v
          fastlane --version

      - name: Validate local iOS credentials script parity
        run: node ./scripts/validate-ios-local-credentials.mjs

      - name: Validate CoreML pipeline assets
        run: npm run coreml:validate -- --strict

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: CocoaPods (clean install)
        run: |
          set -euo pipefail
          rm -rf ios/Pods ios/*.xcworkspace
          cd ios
          pod install --repo-update
          ls -lah
          find . -maxdepth 2 -name "*.xcworkspace" -print -exec ls -lah {} \; || true
          find . -maxdepth 2 -name "contents.xcworkspacedata" -print || true

      - name: Build-for-testing + test on iPhone Simulator via Fastlane
        env:
          IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 15
        run: |
          set -euo pipefail
          fastlane ios ci_simulator
